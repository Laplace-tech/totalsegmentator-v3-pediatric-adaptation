[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsv3-pediatric-adaptation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6", "nibabel==5.3.2", "scipy==1.15.3"]

[project.optional-dependencies]
training = ["torch==2.8.0", "torchvision==0.23.0", "nnunetv2==2.8.1"]
evaluation = ["surface-distance==0.1"]
review = ["pillow==13.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
